<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>천만원으로 세계여행</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:'Jua','Baloo 2','Malgun Gothic',sans-serif;background:#1a1633;user-select:none}
  #app{position:fixed;inset:0;overflow:hidden}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background-size:cover;background-position:center;padding:20px;text-align:center}
  .screen.on{display:flex}
  .titlebox{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);border-radius:24px;padding:26px 30px;backdrop-filter:blur(4px)}
  .titlebox h1{color:#fff;font-size:clamp(26px,6vw,44px);text-shadow:0 3px 8px rgba(0,0,0,.35);margin-bottom:6px}
  .titlebox p{color:#ffe9a8;font-size:clamp(14px,3vw,18px);margin-bottom:20px;font-weight:700}
  .btn{border:none;border-radius:16px;padding:14px 30px;font-family:inherit;font-weight:800;font-size:clamp(16px,3.4vw,20px);color:#fff;background:#2FB86E;box-shadow:0 5px 0 #229455;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #229455}
  .stitle{color:#3a2a66;font-size:clamp(20px,4.6vw,28px);margin-bottom:4px;text-shadow:0 2px 6px rgba(255,255,255,.6)}
  .ssub{color:#5a4a86;font-weight:700;font-size:clamp(13px,2.8vw,16px);margin-bottom:18px}
  .cards{display:flex;gap:clamp(14px,4vw,40px);align-items:flex-end;flex-wrap:wrap;justify-content:center}
  .pick{background:rgba(255,255,255,.9);border:4px solid transparent;border-radius:22px;padding:12px;cursor:pointer;width:clamp(130px,30vw,210px);transition:transform .12s,border-color .12s;box-shadow:0 8px 22px rgba(40,40,90,.2)}
  .pick:hover{transform:translateY(-4px)}.pick img{width:100%;height:clamp(150px,32vh,230px);object-fit:contain}
  .pick .lb{margin-top:6px;font-size:clamp(15px,3vw,19px);color:#3a2a66;font-weight:800}
  .namewrap{background:rgba(255,255,255,.92);border-radius:22px;padding:22px 26px;box-shadow:0 8px 24px rgba(40,40,90,.2)}
  .namein{width:min(80vw,320px);padding:12px;border:2px solid #cfe0f5;border-radius:12px;font-family:inherit;font-size:20px;text-align:center;margin:10px 0}
  .preview{color:#8A5CE0;font-weight:800;font-size:16px;min-height:1.3em;margin-bottom:12px}
  #game{display:none;position:absolute;inset:0}#game.on{display:block}
  #scene{position:absolute;inset:0;background-size:cover;background-position:center;display:none}#scene.on{display:block}
  #heroImg{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);height:min(50vh,340px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));pointer-events:none;transition:opacity .2s}
  #mapwrap{position:absolute;inset:0;overflow:hidden;perspective:1500px;background:#8FD3F0;display:none}#mapwrap.on{display:block}
  svg#map{width:100%;height:100%;display:block;touch-action:none;transform:rotateX(21deg) scale(1.07);transform-origin:center 56%}
  .land{stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke}.noc{fill:#D6E9CF}
  .country{cursor:pointer}.sel{stroke:#2b2350;stroke-width:1.8;vector-effect:non-scaling-stroke}
  .marker{cursor:pointer;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
  .home{fill:#FFD23F;stroke:#E8990C;stroke-width:1.2;vector-effect:non-scaling-stroke}
  .ocean{font-family:'Jua',sans-serif;fill:#fff;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#111;stroke-width:3px}
  .cont{font-family:'Jua',sans-serif;fill:#fff;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#111;stroke-width:2.4px}
  .clbl{font-family:'Jua',sans-serif;fill:#28304a;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2px}
  .isle{fill:#FFD23F;stroke:#E8990C;stroke-width:.8;vector-effect:non-scaling-stroke}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;padding:8px 12px;z-index:5;color:#fff;font-weight:800}
  .chip{background:rgba(43,60,110,.6);border-radius:999px;padding:5px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
  .chip b{color:#FFE9A8}.bar{display:block;height:6px;width:74px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;margin-left:4px}
  .bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .3s}#mBar{background:#FFE9A8}#hBar{background:#FF9AAE}
  #tip{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(43,35,80,.82);color:#fff;padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;display:none}
  #tip.on{display:block}
  #dbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;align-items:flex-end;gap:10px;padding:10px clamp(12px,4vw,60px) calc(12px + env(safe-area-inset-bottom))}
  #dbar.on{display:flex}
  #guide{flex:0 0 auto;width:clamp(80px,13vw,120px);height:clamp(105px,19vw,165px);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22))}
  #guide img{width:100%;height:100%;object-fit:contain}
  #bubble{flex:1;background:#fff;border-radius:20px;padding:14px 20px;min-height:110px;position:relative;box-shadow:0 8px 26px rgba(40,60,110,.3);border:3px solid #EBD9A8}
  #bubble:after{content:'';position:absolute;left:-14px;bottom:28px;border:12px solid transparent;border-right-color:#fff}
  #who{font-size:14px;font-weight:800;color:#8A5CE0;margin-bottom:4px}
  #text{font-size:clamp(15px,3.2vw,20px);line-height:1.5;color:#2b2350;font-weight:700;min-height:2.4em}
  #next{position:absolute;right:16px;bottom:10px;font-size:18px;color:#8A5CE0;animation:bob 1s infinite;display:none}
  @keyframes bob{50%{transform:translateY(3px)}}
  #choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  #choices button{flex:1 1 calc(50% - 8px);min-width:120px;border:none;border-radius:14px;padding:11px;font-family:inherit;font-weight:800;font-size:16px;color:#fff;background:#2FB86E;box-shadow:0 4px 0 #229455;cursor:pointer}
  #choices button.wide{flex-basis:100%}#choices button.no{background:#E06B6B;box-shadow:0 4px 0 #c14e4e}#choices button.alt{background:#5B8DEF;box-shadow:0 4px 0 #3f68bd}
  #quiz{position:absolute;left:0;right:0;bottom:0;top:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px}
  #quiz.on{display:flex}
  .qpanel{background:rgba(255,255,255,.97);border-radius:20px;padding:16px 18px;max-width:520px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.28);text-align:center}
  .qlabel{font-size:clamp(16px,3.6vw,20px);font-weight:800;color:#3B82F6;margin-bottom:10px}
  .qlabel b{color:#E0632B}
  .flags{display:flex;gap:10px;justify-content:center}
  .flags img{width:clamp(80px,20vw,110px);height:clamp(60px,15vw,82px);border-radius:8px;border:3px solid #eee;cursor:pointer;object-fit:cover;background:#f4f4f4}
  .flags img.ok{border-color:#2FB86E;box-shadow:0 0 0 3px #b6eccf}.flags img.no{border-color:#E05656;opacity:.55}
  .caps{display:flex;flex-direction:column;gap:8px}
  .caps button{border:2px solid #cfe0f5;background:#f7fbff;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;font-size:16px;color:#2b2350;cursor:pointer}
  .caps button.ok{border-color:#2FB86E;background:#e9f9f1}.caps button.no{border-color:#E05656;background:#fde9e9;opacity:.7}
  .coin-fly{position:absolute;z-index:8;font-size:24px;pointer-events:none;transition:all .6s cubic-bezier(.4,1.3,.6,1)}
  #sleepFx{position:absolute;inset:0;z-index:8;display:none}#sleepFx.on{display:block}
  #sleepNight{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0}
  #sleepBody{position:absolute;font-size:46px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 14px rgba(255,240,180,.85))}
  #sleepZzz{position:absolute;left:50%;top:56%;transform:translateX(-50%);font-size:38px;animation:zzz 1.8s infinite}
  @keyframes zzz{0%{opacity:.25;transform:translate(-50%,4px)}50%{opacity:.95;transform:translate(-50%,-4px)}100%{opacity:.25;transform:translate(-50%,4px)}}
  #sleepFF{position:absolute;right:16px;bottom:16px;z-index:9;border:none;border-radius:14px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:15px;color:#fff;background:rgba(59,130,246,.92);box-shadow:0 4px 0 #2b62c0;cursor:pointer}
  #polaroid{position:absolute;top:5%;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:6;background:#fff;padding:8px 8px 22px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.32);display:none;width:min(300px,42vw)}

  @keyframes pop{from{opacity:0;transform:translateX(-50%) rotate(-2deg) scale(.9)}to{opacity:1}}
  #polaroidImg{width:100%;height:min(30vh,220px);object-fit:cover;border-radius:3px;display:block;background:#e8eef5}
  #polaroidCap{text-align:center;font-size:15px;color:#3a2a66;font-weight:800;margin-top:6px}
  #polaroid .cr{position:absolute;right:7px;bottom:5px;font-size:8px;color:#b3b3b3}
  #photos{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:12px}
  #photos.on{display:flex}
  #photos .pol{background:#fff;padding:7px 7px 20px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.32);width:min(210px,32vw);position:relative}
  #photos .pol:first-child{transform:rotate(-3deg)}#photos .pol:last-child{transform:rotate(3deg)}
  #photos .pol img{width:100%;height:min(24vh,150px);object-fit:cover;border-radius:3px;display:block;background:#e8eef5}
  #photos .pol .cap{text-align:center;font-size:13px;color:#3a2a66;font-weight:800;margin-top:5px}
  #photos .pol .cr{position:absolute;right:6px;bottom:4px;font-size:8px;color:#b8b8b8}
  #fade{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none;transition:opacity .26s ease}#fade.on{opacity:1;pointer-events:auto}
  #rotate{position:fixed;inset:0;z-index:50;background:#2b2350;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:800;gap:14px}

  .endmsg{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:clamp(18px,4vw,26px);font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.45);padding:20px}
</style></head>

<div id="app">
  <div class="screen on" id="scTitle"><div class="titlebox"><h1>✈️ 천만원으로 세계여행</h1><p>1000만원으로 최대한 많은 나라를 여행해보자!</p><button class="btn" id="startBtn">시작하기 🌍</button></div></div>

    <div class="cards"><div class="pick" data-hero="boy"><img src="characters/hero_boy_happy.png"><div class="lb">남자아이</div></div><div class="pick" data-hero="girl"><img src="characters/hero_girl_happy.png"><div class="lb">여자아이</div></div></div></div>
  <div class="screen" id="scName"><div class="namewrap"><div class="stitle">이름을 알려줘!</div><input class="namein" id="nameIn" placeholder="이름을 써줘" maxlength="8"><div class="preview" id="namePv"></div><button class="btn" id="nameBtn">좋아! ✨</button></div></div>
  <div class="screen" id="scGuide"><div class="stitle">함께할 가이드 요정을 골라줘</div><div class="ssub">여행을 도와줄 요정이야</div>
    <div class="cards"><div class="pick" data-guide="star"><img src="characters/fairy_star_normal.png"><div class="lb">⭐ 별빛요정</div></div><div class="pick" data-guide="moon"><img src="characters/fairy_moon_normal.png"><div class="lb">🌙 달빛요정</div></div></div></div>
  <div id="game">
    <div id="scene"></div><img id="heroImg" src="">
    <div id="mapwrap"><svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg></div>

    <div id="tip"></div>
    <div id="dbar"><div id="guide"></div><div id="bubble"><div id="who"></div><div id="text"></div><div id="next">▶</div><div id="choices"></div></div></div>
    <div id="quiz"></div>
    <div id="sleepFx"><div id="sleepNight"></div><div id="sleepBody">☀️</div><div id="sleepZzz">💤</div><button id="sleepFF">빨리감기 ⏩</button></div>
    <div id="polaroid"><img id="polaroidImg" src=""><div id="polaroidCap"></div><span class="cr">이미지 ⓒ 위키백과</span></div>
    <div id="photos"><div class="pol" id="photoCapWrap"><img id="photoCap"><div class="cap" id="photoCapC"></div><span class="cr">위키백과</span></div><div class="pol" id="photoFoodWrap"><img id="photoFood"><div class="cap" id="photoFoodC"></div><span class="cr">위키백과</span></div></div>
  </div>
</div>
<div id="fade"></div>
<div id="rotate"><div style="font-size:40px">📱↔️</div><div>휴대폰을 <b>가로로</b> 돌려주세요!</div></div>

function easeIO(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
function flyTo(dest,mF,mT,hF,hT,done){const x0=PX(G.cur.lng),y0=PY(G.cur.lat),x1=PX(dest.lng),y1=PY(dest.lat);const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,bow=Math.max(26,Math.min(180,len*.24));
  function pos(k){const o=Math.sin(k*Math.PI)*bow;return[x0+dx*k+nx*o,y0+dy*k+ny*o];}const cx=x0+dx*.5+nx*bow*2,cy=y0+dy*.5+ny*bow*2;

  requestAnimationFrame(fr);}

// 위키백과에서 대표 이미지 자동 취득(CORS, 무료, 키 불필요). ko→en 순서 시도, 캐시.
const wikiCache={};
function wikiImage(attempts,cb){
  if(typeof fetch!=='function'){cb(null);return;}
  const key=attempts.map(a=>a.lang+':'+a.title).join('|');
  if(wikiCache[key]!==undefined){cb(wikiCache[key]);return;}
  let i=0;
  const go=()=>{if(i>=attempts.length){wikiCache[key]=null;cb(null);return;}
    const a=attempts[i++];if(!a.title){go();return;}
    fetch(`https://${a.lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(a.title)}&prop=pageimages&piprop=thumbnail&pithumbsize=440&format=json&redirects=1&origin=*`)
     .then(r=>r.json()).then(d=>{let src=null;const p=d&&d.query&&d.query.pages;if(p)for(const k in p){if(p[k].thumbnail&&p[k].thumbnail.source)src=p[k].thumbnail.source;}
       if(src){wikiCache[key]=src;cb(src);}else go();}).catch(()=>go());};
  go();}

// 해 뜨고 지는 수면 애니메이션(기본 10초, 빨리감기 가능)
function sleepAnim(done){const fx=document.getElementById('sleepFx'),night=document.getElementById('sleepNight'),body=document.getElementById('sleepBody'),ff=document.getElementById('sleepFF');
  fx.classList.add('on');let dur=10000,t0=null,sped=false;ff.onclick=()=>{sped=true;};
  function fr(ts){if(!t0)t0=ts;if(sped)t0-=dur*0.05;let t=Math.min(1,(ts-t0)/dur);
    const dark=Math.sin(t*Math.PI);night.style.opacity=dark;
    body.style.left=(6+t*88)+'%';body.style.top=(60-Math.sin(t*Math.PI)*44)+'%';body.textContent=dark>0.5?'🌙':'☀️';
    if(t<1)requestAnimationFrame(fr);else{fx.classList.remove('on');ff.onclick=null;night.style.opacity=0;done&&done();}}
  requestAnimationFrame(fr);}
function doSleep(after){const hc=G.hotelCost;G.money=Math.max(0,G.money-hc);setHUD(G.money,G.hp);
  document.getElementById('dbar').classList.remove('on');document.getElementById('heroImg').style.opacity='0';G.phase='sleep';
  transition(()=>{scene('bg_hotel_day');sleepAnim(()=>{G.hp=Math.min(100,G.hp+HP_NIGHT);setHUD(G.money,G.hp);setHero('happy');after();});});}
function afterNight1(){run([{who:'guide',expr:'pray',text:`잘 잤어? 체력을 ${HP_NIGHT}만큼 회복했어! 지금까지 ${G.visited.length}군데를 여행했고, 남은 돈은 ${G.money}만원이야.`}],offer2nd);}
function offer2nd(){if(G.money<G.hotelCost){run([{who:'guide',expr:'normal',text:'이제 다음 나라로 떠나볼까?'}],leaveHotel);return;}
  run([{who:'guide',expr:'normal',text:`한 번 더 자면 체력도 더 채우고, 카드 뒤집기 미니게임으로 용돈도 벌 수 있어! 하룻밤 더 잘까? (호텔비 ${G.hotelCost}만원)`,
    choices:[{label:'한 번 더 잔다 🛏️',go:()=>doSleep(afterNight2)},{label:'이제 떠날래 ✈️',go:leaveHotel}]}]);}
function afterNight2(){run([{who:'guide',expr:'pray',text:`이틀째 밤도 푹 잤어! 체력도 든든하게 채웠어 😊 (여기서 하는 카드 뒤집기 미니게임은 다음 단계에서 열려요 🃏)`}],leaveHotel);}
function leaveHotel(){transition(()=>{document.getElementById('dbar').classList.remove('on');mapview();G.phase='map';tip('다음 나라를 골라봐!');});}
function endGame(){document.getElementById('dbar').classList.remove('on');const t=document.createElement('div');t.className='endmsg';t.textContent='👋 다음에 또 만나!';document.getElementById('game').appendChild(t);}
setVB();
// 테스트 훅
window.__s={G,R,vocative,ticketMax,applyDisc,ff:()=>document.getElementById('sleepFF').click(),
 start:()=>document.getElementById('startBtn').click(),pickHero:h=>document.querySelector(`#scHero .pick[data-hero="${h}"]`).click(),
 setName:n=>{document.getElementById('nameIn').value=n;document.getElementById('nameBtn').click();},pickGuide:g=>document.querySelector(`#scGuide .pick[data-guide="${g}"]`).click(),
 advance,choose:i=>document.getElementById('choices').children[i].click(),travel:iso=>startTravel(iso),
 pickFlag:iso=>pickFlag(iso,document.querySelector('#flagRow img')),pickCap:c=>{[...document.querySelectorAll('#capRow button')].find(b=>b.textContent===c).click();},
 get T(){return T;},get state(){return{phase:G.phase,text:document.getElementById('text').textContent,choices:[...document.getElementById('choices').children].map(b=>b.textContent),money:G.money,hp:G.hp,visited:G.visited.slice(),cur:G.cur&&G.cur.iso,quizOn:document.getElementById('quiz').classList.contains('on'),flags:document.querySelectorAll('#flagRow img').length,caps:[...document.querySelectorAll('#capRow button')].map(b=>b.textContent)};}};
</script>
</body></html>
