<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속담 맞추기 · 속담마법왕 되기 · 수호엄마의 playground</title>
<meta name="description" content="그림을 보고 속담 빈칸을 맞혀 금화를 모으고, 아이템 10개를 모아 속담마법왕이 되어보세요! 초등 속담 학습 게임.">
<meta property="og:title" content="속담 맞추기 · 속담마법왕 되기">
<meta property="og:description" content="속담을 맞혀 금화를 모으고 속담마법왕 아이템을 모아요!">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#4A3D24;--dim:#9A8355;--card:#fff;--line:#F3E4BE;--pink:#FF6B9D;--yellow:#FFC542;--gold:#FFB300;--mint:#3FB27F;--sky:#4AA8E0;--grape:#8A5CE0;--tomato:#FF6B57;--shadow:0 4px 0 rgba(150,110,40,.16);--shadow-lg:0 16px 36px rgba(150,90,180,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:var(--ink);line-height:1.6;overflow-x:hidden;
 background:radial-gradient(60% 40% at 8% 0%,rgba(255,206,74,.5),transparent 58%),radial-gradient(50% 40% at 95% 8%,rgba(138,92,224,.22),transparent 60%),radial-gradient(46% 40% at 92% 100%,rgba(255,140,180,.28),transparent 62%),linear-gradient(165deg,#FFF7D6,#FFEBC0 50%,#FFF0D8);background-attachment:fixed;min-height:100vh}
.disp{font-family:'Baloo 2',cursive,sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:12px 14px 40px}
header{text-align:center;padding:10px 0 2px}
.brand{font-size:12.5px;font-weight:800;color:var(--dim)}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,6vw,34px);margin:2px 0}
h1 .hl{color:var(--grape)}
.card{background:var(--card);border:3px solid #fff;border-radius:26px;box-shadow:var(--shadow-lg);padding:18px;margin-top:12px;position:relative;overflow:hidden}
.hidden{display:none!important}
.btn{font-family:'Baloo 2',sans-serif;font-weight:800;border:none;border-radius:16px;padding:14px 26px;font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(180deg,#FF8A5C,#FF6B57);color:#fff}
.btn.next{background:linear-gradient(180deg,#54c98f,#3FB27F);color:#fff;width:100%;margin-top:14px}
.btn.grape{background:linear-gradient(180deg,#9E74F0,#8A5CE0);color:#fff}

/* 인트로 */
#intro{text-align:center}
#intro .king{width:150px;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 10px 12px rgba(140,90,200,.28))}
#intro h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;margin:6px 0 4px;color:var(--grape)}
#intro .msg{background:#F7F1FF;border:2px dashed #D9C7F5;border-radius:16px;padding:14px 16px;font-weight:700;font-size:14px;color:#6B4BA8;margin:12px 0}
.namebox{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.namebox .lab{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;color:var(--ink)}
#nameIn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;text-align:center;border:3px solid var(--line);border-radius:14px;padding:10px 14px;width:150px;color:var(--grape);background:#FFFDF7}
#nameIn:focus{outline:none;border-color:var(--grape)}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFF9EC,#fff);border:2px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:12px}
.hud .avatar{width:78px;height:88px;flex:0 0 auto}
.hud .avatar svg{width:100%;height:100%;overflow:visible}
.hud .info{flex:1;min-width:0}
.hud .king-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--grape);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .coins{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--gold);display:flex;align-items:center;gap:4px}
.hud .items-bar{display:flex;gap:3px;margin-top:5px}
.hud .slot{width:100%;height:9px;border-radius:99px;background:#EFE2C2;flex:1}
.hud .slot.on{background:linear-gradient(90deg,#FFD35A,#FFB300)}
.hud .next-txt{font-size:11px;font-weight:800;color:var(--dim);margin-top:4px}
#quitBtn{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:12px;font-weight:800;font-size:12px;color:var(--dim);padding:6px 10px;cursor:pointer}

.avatar.bounce svg{animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px) scale(1.05)}60%{transform:translateY(0) scale(.98)}}

/* 그림 */
.scene{width:100%;aspect-ratio:1024/572;object-fit:cover;border-radius:18px;border:3px solid #fff;box-shadow:0 6px 16px rgba(150,110,40,.16);background:#f6ecd0;display:block}
.sent{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(20px,5.5vw,27px);text-align:center;margin:16px 0 6px;line-height:1.9;word-break:keep-all}
.slot2{display:inline-block;min-width:104px;text-align:center;padding:2px 14px;color:var(--grape);border-bottom:5px dashed var(--grape);margin:0 3px;border-radius:4px}
.slot2.empty{background:#F5EFFF}
.slot2.filled{border-bottom-style:solid}
.slot2.ok{color:var(--mint);border-bottom-color:var(--mint)}
.slot2.no{color:var(--tomato);border-bottom-color:var(--tomato)}
.blank-label{font-weight:800;font-size:12.5px;color:var(--dim);text-align:center;margin:12px 0 4px}
.opts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.opt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;background:#fff;border:3px solid var(--line);border-radius:15px;padding:12px 20px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--grape);background:#F5EFFF;color:var(--grape)}
.opt.correct{border-color:var(--mint);background:#E7F7EF;color:var(--mint)}
.opt.wrong{border-color:var(--tomato);background:#FFF0ED;color:var(--tomato)}
.opt[disabled]{cursor:default}

/* 공개 */
.reveal{margin-top:14px;border-radius:18px;padding:16px;border:3px solid var(--line);background:linear-gradient(180deg,#FFFDF4,#fff);display:none}
.reveal.show{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.reveal .res{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:8px}
.reveal .res.o{color:var(--mint)} .reveal .res.x{color:var(--tomato)}
.reveal .full{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;text-align:center;color:var(--ink);margin-bottom:12px}
.reveal .line{font-size:14.5px;font-weight:700;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.reveal .line .k{flex:0 0 auto;color:#fff;background:var(--sky);border-radius:8px;padding:2px 10px;font-size:12px;font-family:'Baloo 2',sans-serif}
/* 사자성어 크게 */
.reveal .idiom-box{margin-top:12px;background:#F5EFFF;border:2px solid #E0D2F7;border-radius:14px;padding:12px;text-align:center}
.reveal .idiom-box .k2{font-size:12px;font-weight:800;color:var(--grape)}
.reveal .idiom-box .val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);color:var(--grape);margin-top:2px;letter-spacing:1px}

/* 아이템 획득 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(60,40,90,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop-card{background:#fff;border-radius:26px;padding:26px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(80,40,120,.4);animation:popin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pop-card .ttl{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--gold)}
.pop-card .itemimg{width:130px;height:145px;margin:8px auto 4px}
.pop-card .itemimg svg{width:100%;height:100%;overflow:visible}
.pop-card .nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--grape);margin:2px 0 4px}
.pop-card .sub{font-weight:700;font-size:13px;color:var(--dim);margin-bottom:14px}

/* 피날레 */
#finale{text-align:center;display:none}
#finale .crown{font-size:44px}
#finale .bigav{width:230px;height:auto;margin:6px auto;filter:drop-shadow(0 14px 16px rgba(140,90,200,.3))}
#finale .title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:var(--grape);margin:4px 0}
#finale .cong{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--gold);margin:2px 0 6px}
#finale .cap-hint{font-weight:700;font-size:13px;color:var(--dim);background:#FFF7E4;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti{position:absolute;width:11px;height:11px;border-radius:2px;will-change:transform,opacity}
.coinfly{position:absolute;font-size:26px;will-change:transform,opacity;z-index:61}
.plusfly{position:absolute;display:flex;align-items:center;gap:4px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--gold);z-index:61;text-shadow:0 2px 0 #fff}

footer{text-align:center;margin-top:16px;color:var(--dim);font-weight:700;font-size:11.5px;line-height:1.7}
footer a{color:var(--dim)}
</style>
</head>
<body>
<div id="fx"></div>
<div class="wrap">
  <header>
    <div class="brand">📚 수호엄마의 playground</div>
    <h1>속담 <span class="hl">맞추기</span></h1>
  </header>

  <!-- 인트로 -->
  <div class="card" id="intro">
    <div class="king" id="introKing"></div>
    <h2>속담마법왕이 되어보자!</h2>
    <div class="msg">속담마법왕이 되기 위한 <b>아이템을 모두 모아봐!</b><br>총 <b>10가지 아이템</b>이 있어. 문제를 풀면서 <b>금화</b>가 나오고,<br>금화가 <b>10개 이상</b>일 때마다 <b>아이템이 등장</b>해! ✨</div>
    <div class="namebox">
      <span class="lab">속담마법왕</span>
      <input id="nameIn" maxlength="6" placeholder="이름" autocomplete="off">
    </div>
    <button class="btn go" id="startBtn" style="margin-top:12px">모험 시작! ✨</button>
  </div>

  <!-- 게임 -->
  <div class="card hidden" id="game">
    <div class="hud">
      <div class="avatar" id="hudAvatar"></div>
      <div class="info">
        <div class="king-name" id="hudName">속담마법왕</div>
        <div class="coins"><svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-0.2em"><circle cx="12" cy="12" r="10" fill="#FFCF5A" stroke="#E0A93A" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#E6B84A" stroke-width="1.5"/><ellipse cx="9" cy="8.5" rx="2.6" ry="1.7" fill="#FFF0C0" opacity=".85"/></svg> <span id="coinNum">0</span></div>
        <div class="items-bar" id="itemsBar"></div>
        <div class="next-txt" id="nextTxt"></div>
      </div>
      <button id="quitBtn">그만</button>
    </div>

    <img class="scene" id="scene" alt="속담 그림">
    <div class="sent" id="sent"></div>
    <div id="optArea"></div>
    <button class="btn next hidden" id="submitBtn">확인!</button>

    <div class="reveal" id="reveal">
      <div class="res" id="res"></div>
      <div class="full" id="full"></div>
      <div class="line"><span class="k">뜻</span><span id="mean"></span></div>
      <div class="idiom-box" id="idiomBox"><div class="k2">비슷한 사자성어</div><div class="val" id="idiom"></div></div>
      <button class="btn next" id="nextBtn">다음 문제 →</button>
    </div>
  </div>

  <!-- 아이템 획득 오버레이 -->
  <div class="overlay" id="itemOverlay">
    <div class="pop-card">
      <div class="ttl">🎉 새 아이템 획득!</div>
      <div class="itemimg" id="popItemImg"></div>
      <div class="nm" id="popItemName"></div>
      <div class="sub" id="popItemCount"></div>
      <button class="btn grape" id="popOkBtn" style="width:100%">좋아! 👍</button>
    </div>
  </div>

  <!-- 피날레 -->
  <div class="card" id="finale">
    <div class="crown">👑</div>
    <div class="bigav" id="finaleAvatar"></div>
    <div class="title" id="finaleTitle">속담마법왕</div>
    <div class="cong">🎉 축하해! 아이템 10개를 모두 모았어! 🎉</div>
    <div class="cap-hint">📸 이 화면을 캡처해서 자랑해봐!</div>
    <button class="btn go" id="againBtn" style="margin-top:6px">다시 하기</button>
  </div>

  <footer>
    만든이 · 수호엄마 · <a href="mailto:seungju613@gmail.com">seungju613@gmail.com</a><br>
    무료 소스와 AI로 제작 · 그림 출처 문제 시 메일로 연락 주세요
  </footer>
</div>

<script>

let AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function tone(freqs,dur,type){ const c=ac(); if(!c)return; let t=c.currentTime; freqs.forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);t+=dur*0.85;}); }
const sGood=()=>tone([660,880,1046],0.12), sBad=()=>tone([300,220],0.16), sTap=()=>tone([520],0.05), sCoin=()=>tone([1046,1318],0.08,'triangle'), sItem=()=>tone([660,880,1046,1318],0.14,'triangle');

/* ---------- fx ---------- */
const FX=$('#fx');
function confetti(cx,cy){
  const cols=['#FFC542','#FF6B9D','#3FB27F','#4AA8E0','#8A5CE0','#FF6B57'];
  for(let i=0;i<28;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=cx+'px'; d.style.top=cy+'px'; d.style.background=cols[i%cols.length];
    FX.appendChild(d);
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*160;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist - 60 + Math.random()*120;
    if(d.animate){ d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+180}px) rotate(${360+Math.random()*360}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>d.remove(); }
    else setTimeout(()=>d.remove(),1400);
  }
}
function flyCoins(n, fromX, fromY){
  const tgt=$('#coinNum').getBoundingClientRect(); const tx=tgt.left+tgt.width/2, ty=tgt.top+tgt.height/2;
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='coinfly'; c.innerHTML=COIN;
    c.style.left=fromX+'px'; c.style.top=fromY+'px'; FX.appendChild(c);
    const delay=i*160;
    if(c.animate){ c.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0,offset:0},{transform:'translate(-50%,-50%) scale(1.3)',opacity:1,offset:.15},{transform:`translate(calc(${tx-fromX}px - 50%),calc(${ty-fromY}px - 50%)) scale(.7)`,opacity:1,offset:.9},{transform:`translate(calc(${tx-fromX}px - 50%),calc(${ty-fromY}px - 50%)) scale(.2)`,opacity:0}],{duration:900,delay,easing:'cubic-bezier(.4,.1,.3,1)',fill:'forwards'}).onfinish=()=>{c.remove(); sCoin();}; }
    else setTimeout(()=>c.remove(),900+delay);
  }
}
function plusFloat(n, x, y){
  const p=document.createElement('div'); p.className='plusfly'; p.innerHTML='+'+n+' '+COIN;
  p.style.left=x+'px'; p.style.top=y+'px'; FX.appendChild(p);
  if(p.animate){ p.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-14px) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-46px) scale(1)',opacity:0}],{duration:1200,easing:'ease-out'}).onfinish=()=>p.remove(); }
  else setTimeout(()=>p.remove(),1200);
}

/* ---------- HUD ---------- */
function updateHUD(){
  $('#hudAvatar').innerHTML=avatarSVG(equippedKeys());
  $('#hudName').textContent='속담마법왕 '+name;
  $('#coinNum').textContent=coins;
  // 아이템 진행바 10칸
  const bar=$('#itemsBar'); bar.innerHTML='';
  for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='slot'+(i<itemsEarned?' on':''); bar.appendChild(s); }
  const toNext=(itemsEarned<10)?((itemsEarned+1)*10 - coins):0;
  $('#nextTxt').textContent = itemsEarned>=10 ? '아이템 10개 완성! 👑' : ('다음 아이템까지 금화 '+toNext+'개  ·  아이템 '+itemsEarned+'/10');
}

/* ---------- 흐름 ---------- */
function start(){
  const v=$('#nameIn').value.trim(); name=v||'꼬마';
  coins=0; itemsEarned=0; queue=shuffle([...Array(DATA.length).keys()]); idx=0;
  $('#intro').classList.add('hidden'); $('#finale').style.display='none'; $('#game').classList.remove('hidden');
  updateHUD(); render();
}
function render(){
  answered=false; sel={};
  cur=DATA[queue[idx]];
  if(cur.blanks.length===2){ const r=Math.random(); active = r<0.5 ? [0,1] : [ Math.random()<0.5?0:1 ]; }
  else active=[0];
  window.__cur=cur; window.__active=active;
  $('#scene').src=IMGDIR+cur.img+'.jpg';
  paintSentence(); paintOptions();
  $('#reveal').classList.remove('show');
  const sb=$('#submitBtn'); sb.classList.add('hidden'); sb.disabled=true; sb.onclick=submit;
}
function partsOf(){ return cur.tpl.split(/(\{\d\})/).filter(x=>x!==''); }
function paintSentence(){
  const html=partsOf().map(p=>{
    const m=p.match(/^\{(\d)\}$/);
    if(!m) return '<span>'+p+'</span>';
    const bi=+m[1];
    if(active.includes(bi)){
      const v=sel[bi]; let cls='slot2'+(v?' filled':' empty');
      if(answered){ cls='slot2 '+(sel[bi]===cur.blanks[bi].a?'ok':'no'); }
      const inner = answered ? cur.blanks[bi].a : (v || '?');
      return '<span class="'+cls+'">'+inner+'</span>';
    }
    return '<span>'+cur.blanks[bi].a+'</span>';
  }).join(' ');
  $('#sent').innerHTML=html;
}
function paintOptions(){
  const area=$('#optArea'); area.innerHTML='';
  active.forEach(bi=>{
    const b=cur.blanks[bi];
    if(active.length>1){ const lb=document.createElement('div'); lb.className='blank-label'; lb.textContent=(active.indexOf(bi)+1)+'번 빈칸'; area.appendChild(lb); }
    const row=document.createElement('div'); row.className='opts';
    shuffle(b.o).forEach(word=>{
      const btn=document.createElement('button'); btn.className='opt'; btn.textContent=word;
      btn.dataset.blank=bi; btn.dataset.word=word; btn.onclick=()=>pick(bi,word,row);
      row.appendChild(btn);
    });
    area.appendChild(row);
  });
}
function pick(bi,word,row){
  if(answered) return; sTap(); sel[bi]=word;
  row.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.word===word));
  paintSentence();
  const done=active.every(i=>sel[i]!==undefined);
  const sb=$('#submitBtn'); sb.classList.toggle('hidden',!done); sb.disabled=!done;
}
function submit(){
  if(answered) return; answered=true;
  const correct=active.every(i=>sel[i]===cur.blanks[i].a);
  document.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; const bi=+o.dataset.blank,w=o.dataset.word;
    if(w===cur.blanks[bi].a) o.classList.add('correct'); else if(sel[bi]===w) o.classList.add('wrong'); o.classList.remove('sel'); });
  paintSentence();
  $('#submitBtn').classList.add('hidden');
  $('#res').textContent=correct?'정답이에요! 🎉':'아쉬워요, 정답을 볼까요? 😊';
  $('#res').className='res '+(correct?'o':'x');
  $('#full').textContent='"'+cur.full+'"';
  $('#mean').textContent=cur.mean;
  if(cur.idiom){ $('#idiomBox').style.display='block'; $('#idiom').textContent=cur.idiom; } else $('#idiomBox').style.display='none';
  $('#reveal').classList.add('show');
  $('#nextBtn').onclick=next;
  if(correct){
    sGood();
    const av=$('#hudAvatar'); av.classList.remove('bounce'); void av.offsetWidth; av.classList.add('bounce');
    const sc=$('#scene').getBoundingClientRect();
    confetti(sc.left+sc.width/2, sc.top+sc.height/2);
    const gained=active.length;
    plusFloat(gained, sc.left+sc.width/2, sc.top+sc.height/2);
    flyCoins(gained, sc.left+sc.width/2, sc.top+sc.height/2);
    coins+=gained;
    setTimeout(()=>{ $('#coinNum').textContent=coins; checkItems(); }, 700);
  } else { sBad(); }
}
function checkItems(){
  const newEarned=Math.min(10, Math.floor(coins/10));
  updateHUD();
  const pending=[];
  while(itemsEarned<newEarned){ pending.push(ITEMS[itemsEarned]); itemsEarned++; }
  updateHUD();
  if(pending.length){ showItemPops(pending,0); }
}
function showItemPops(list, i){
  if(i>=list.length){ if(itemsEarned>=10) setTimeout(finale,300); return; }
  const it=list[i];
  $('#popItemImg').innerHTML=itemMiniSVG(it.key);
  $('#popItemName').textContent=it.name;
  $('#popItemCount').textContent='아이템 '+(ITEMS.indexOf(it)+1)+' / 10';
  $('#itemOverlay').classList.add('show'); sItem();
  const r=FX.getBoundingClientRect(); confetti(r.width/2, r.height*0.4);
  $('#popOkBtn').onclick=()=>{ $('#itemOverlay').classList.remove('show'); showItemPops(list,i+1); };
}
function next(){
  idx++;
  if(idx>=queue.length){ queue=shuffle([...Array(DATA.length).keys()]); idx=0; }
  render();
  $('#game').scrollIntoView({behavior:'smooth',block:'start'});
}
function finale(){
  $('#game').classList.add('hidden'); $('#intro').classList.add('hidden');
  $('#finaleAvatar').innerHTML=avatarSVG(equippedKeys());
  $('#finaleTitle').textContent='속담마법왕 '+name;
  $('#finale').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  let n=0; const iv=setInterval(()=>{ const r=FX.getBoundingClientRect(); confetti(Math.random()*r.width, -10); if(++n>6)clearInterval(iv); },400);
}
function quit(){
  // 그만하기: 지금까지 아바타로 격려 화면
  $('#game').classList.add('hidden');
  $('#finaleAvatar').innerHTML=avatarSVG(equippedKeys());
  $('#finaleTitle').textContent='속담마법왕 '+name;
  $('#finale').querySelector('.cong').textContent = itemsEarned>=10 ? '🎉 아이템 10개 완성! 🎉' : ('지금까지 아이템 '+itemsEarned+'개를 모았어! 또 도전해봐 💪');
  $('#finale').querySelector('.crown').textContent = itemsEarned>=10 ? '👑' : '⭐';
  $('#finale').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

$('#startBtn').onclick=start;
$('#nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
$('#againBtn').onclick=()=>{ $('#finale').style.display='none'; $('#intro').classList.remove('hidden'); };
$('#quitBtn').onclick=quit;
// 인트로 아바타(기본 모습)
$('#introKing').innerHTML=avatarSVG([]);
</script>
